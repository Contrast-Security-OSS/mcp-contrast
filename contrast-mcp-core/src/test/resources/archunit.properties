# FreezingArchRule violation store (see ArchitectureTest).
#
# The store at src/test/resources/archunit-store grandfathers known
# architectural violations. It is a ratchet: entries may only be removed,
# never added, without explicit user approval (same policy as checkstyle
# suppressions).
#
# allowStoreUpdate=false keeps every run read-only, including CI and PIT.
# After fixing a grandfathered violation, run
#   ./gradlew :contrast-mcp-core:test -ParchStoreUpdate
# to remove it from the store, then commit the shrunken store.
#
# To add a NEW frozen rule: temporarily set allowStoreCreation=true, run the
# tests once WITH -ParchStoreUpdate (recording a new rule's entry counts as a
# store update), set allowStoreCreation back to false, and commit the store.
freeze.store.default.path=src/test/resources/archunit-store
freeze.store.default.allowStoreCreation=false
freeze.store.default.allowStoreUpdate=false
