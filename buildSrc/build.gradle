plugins {
    id 'java-library'
}

// buildSrc does not inherit settings.gradle's dependencyResolutionManagement block.
repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

// Gradle does not apply the repository's gradle.properties to buildSrc. Load it directly
// rather than duplicating the pins, keeping one source of truth. See SECURITY.md.
def rootProperties = new Properties()
rootProject.file('../gradle.properties').withInputStream { rootProperties.load(it) }

dependencies {
    testImplementation "org.junit.jupiter:junit-jupiter:${rootProperties.junitVersion}"
    testImplementation "org.assertj:assertj-core:${rootProperties.assertjVersion}"
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}
