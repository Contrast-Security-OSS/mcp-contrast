plugins {
    id 'java-library'
}

// buildSrc is a separate build, so it does not inherit settings.gradle's
// dependencyResolutionManagement block and must declare its own repository.
repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

// buildSrc is its own build rooted at buildSrc/, so Gradle does not apply the repository's
// gradle.properties to it. Load that file directly rather than duplicating the pins here,
// so there stays one source of truth for versions as repo policy requires. See SECURITY.md.
def rootProperties = new Properties()
rootProject.file('../gradle.properties').withInputStream { rootProperties.load(it) }

dependencies {
    testImplementation "org.junit.jupiter:junit-jupiter:${rootProperties.junitVersion}"
    testImplementation "org.assertj:assertj-core:${rootProperties.assertjVersion}"
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}
