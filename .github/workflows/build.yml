name: Java CI with Gradle

on:
  push:
    branches: [ main, master ]
  # Unfiltered on purpose: stacked PRs target a parent feature branch, and a base filter
  # would skip them entirely, leaving the changed-file coverage gate unenforced.
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Harden the runner (Audit all outbound calls)
      uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
      with:
        egress-policy: audit

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        # Depth 1 fetches neither the PR base commit nor the merge base, which the
        # changed-file coverage step needs.
        fetch-depth: 0
        # This job runs PR-authored build code and no step pushes.
        persist-credentials: false
    - name: Validate Gradle wrapper
      uses: gradle/actions/wrapper-validation@889dc537cf3672c0c060560c9ead940a2b8b7077 # v6

    - name: Set up JDK 21
      uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle
    # buildSrc is a separate build, so the main build never schedules its tests, and the
    # coverage gate's own logic lives there.
    - name: Run buildSrc checks and tests
      run: ./gradlew -p buildSrc check --no-daemon

    # check is the single verification gate (ADR 0003); new verifications attached to it
    # are picked up here with no workflow change.
    - name: Run check lifecycle and build
      run: ./gradlew check :contrast-mcp-stdio-app:bootJar --no-daemon

    # Pull requests only. With no base the task falls back to the working tree, which is
    # clean on a fresh checkout and would pass vacuously.
    - name: Verify changed-file coverage and PMD
      if: github.event_name == 'pull_request'
      # Via env so no workflow expression is parsed as shell.
      env:
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
      run: >-
        ./gradlew jacocoChangedFileCoverageVerification
        verifyPmdChangedFilesBaseline
        -PstaticAnalysisChangedBase="$BASE_SHA"
        --no-daemon

    # Runs even when the coverage floor fails, since that is exactly when the
    # numbers and the HTML report are needed to diagnose the failure. coverageSummary
    # only reads the reports the coverage step wrote, so this does not re-run the tests;
    # if that step failed before producing them, the table says so per module. !cancelled()
    # rather than always(), so cancelling the workflow actually stops it.
    - name: Publish coverage summary
      if: ${{ !cancelled() }}
      run: ./gradlew --quiet coverageSummary --no-daemon >> "$GITHUB_STEP_SUMMARY"

    - name: Upload coverage and static analysis reports
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: test-reports
        path: |
          **/build/reports/jacoco/test/html/**
          **/build/reports/jacoco/test/jacocoTestReport.xml
          **/build/reports/pitest/**
          **/build/reports/pmd/**
          **/build/reports/pmd-changed/**
          **/build/reports/pmd-rule-controls/**
        if-no-files-found: warn
        # Diagnostic output for a failed run, not a durable artifact.
        retention-days: 7

  # Run integration tests against a live TeamServer on internal PRs only.
  # Fork PRs never receive secrets, and Dependabot PRs only change dependency
  # versions (no application code), so both are skipped to avoid unnecessary
  # load on the test org.
  integration-test:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.fork != true
      && github.actor != 'dependabot[bot]'
    needs: build
    concurrency:
      group: integration-test-${{ github.event.pull_request.number }}
      cancel-in-progress: true

    steps:
    - name: Harden the runner (Audit all outbound calls)
      uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
      with:
        egress-policy: audit

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Validate Gradle wrapper
      uses: gradle/actions/wrapper-validation@889dc537cf3672c0c060560c9ead940a2b8b7077 # v6

    - name: Set up JDK 21
      uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Run integration tests
      env:
        CONTRAST_HOST_NAME: ${{ secrets.CONTRAST_HOST_NAME }}
        CONTRAST_API_KEY: ${{ secrets.CONTRAST_API_KEY }}
        CONTRAST_SERVICE_KEY: ${{ secrets.CONTRAST_SERVICE_KEY }}
        CONTRAST_USERNAME: ${{ secrets.CONTRAST_USERNAME }}
        CONTRAST_ORG_ID: ${{ secrets.CONTRAST_ORG_ID }}
      run: ./gradlew :contrast-mcp-stdio-app:requireIntegrationTestCredentials :contrast-mcp-stdio-app:integrationTest --no-daemon
