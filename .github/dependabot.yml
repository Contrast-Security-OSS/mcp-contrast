version: 2
# Deliberately ungrouped. dependabot/fetch-metadata reports a single update-type
# for a grouped PR, taken from the highest semver change in the group, so one
# major bump made every minor and patch bump in that group ineligible for the
# auto-merge workflow. One PR per bump means each is judged on its own change.
# open-pull-requests-limit is raised past the default of 5 so ungrouping does not
# throttle a weekly run to five bumps.
updates:
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 15
    cooldown:
      default-days: 7

  - package-ecosystem: github-actions
    # "/" covers .github/workflows only. Local composite actions must be listed
    # explicitly or Dependabot never sees their pins. Composites exist so pin
    # bumps do not modify workflow files, which GitHub refuses to run
    # pull_request checks for on Dependabot PRs (AIML-1245).
    directories:
      - /
      - /.github/actions/build-docker-image
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
      include:
          - '*'
      exclude:
          - react

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
