spring.application.name=mcp-contrast
spring.main.web-application-type=none
spring.ai.mcp.server.name=mcp-contrast
spring.ai.mcp.server.version=@project.version@
# Server instructions (MCP initialize result). Home for conventions uniformly true across
# every exposed tool, per MCP_STANDARDS.md "Server Instructions" (AIML-942). Keep repo-local:
# never name hosted-only aiml-services tools here.
spring.ai.mcp.server.instructions=Results reflect only data visible to the configured credentials; a missing item may mean restricted access rather than absence. Values within a comma-separated filter parameter are ORed; different filter parameters are ANDed.

spring.main.banner-mode=off
logging.pattern.console=

# Contrast configuration - binds to ContrastProperties record
# Environment variables (CONTRAST_*) are mapped via relaxed binding
contrast.host-name=${CONTRAST_HOST_NAME:}
contrast.api-key=${CONTRAST_API_KEY:}
contrast.service-key=${CONTRAST_SERVICE_KEY:}
contrast.user-name=${CONTRAST_USERNAME:}
contrast.org-id=${CONTRAST_ORG_ID:}
contrast.http-proxy-host=${http.proxy.host:${http_proxy_host:}}
contrast.http-proxy-port=${http.proxy.port:${http_proxy_port:}}
# Only HTTPS is supported. The server will refuse to start with HTTP or other protocols.
contrast.api.protocol=https
contrast.protocol=${contrast.api.protocol:https}
